name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test -p interview-core --locked
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: python scripts/prepare-resources.py
      - run: cargo fetch --locked
      - run: python scripts/collect-licenses.py
      - run: cargo test -p interview-assistant --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Interview-Assistant-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
