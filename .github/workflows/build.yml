name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/runtime
            artifacts/onnxruntime-win-x64-1.22.0.zip
          key: ocr-assets-${{ hashFiles('scripts/resources.lock.json') }}
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test -p interview-core --locked
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: python scripts/prepare-resources.py
      - run: ./scripts/prepare-msvc.ps1
      - run: cargo fetch --locked
      - run: python scripts/collect-licenses.py
      - run: cargo test -p interview-assistant --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri -- build --bundles nsis
      - run: ./scripts/test-installer.ps1
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Interview-Assistant-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            artifacts/installed-ocr.json
          if-no-files-found: error
