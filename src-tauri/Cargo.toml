[package]
name = "interview-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "interview-assistant"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
interview-core = { path = "../crates/core" }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "3", features = ["windows-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
paddle-ocr-rs = { version = "=0.6.1", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic", "std"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Dwm"] }
